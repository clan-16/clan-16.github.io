<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrimonio Anna & Claudio</title>
  <style>
    :root {
      --primary-color: #5a6b5c; /* Verde salvia elegante */
      --accent-color: #d4a373;  /* Tono caldo/oro */
      --bg-color: #fefae0;      /* Sfondo crema chiaro */
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 60px 20px 20px;
    }

    h1 {
      font-size: 2.8rem;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .date {
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      font-weight: bold;
      text-transform: uppercase;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      margin: 20px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .countdown-item {
      background: var(--bg-color);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 60px;
    }

    .countdown-number {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .btn-rsvp {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      margin-top: 20px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(90, 107, 92, 0.3);
    }

    .btn-rsvp:hover {
      background-color: #485549;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Anna & Claudio</h1>
    <p class="date">24 Aprile 2027</p>
  </header>

  <div class="container">

      <p>In questa pagina troverete tutte le informazioni utili sull'evento.</p>

          <div id="days" class="countdown-number">0</div>
          <div>Giorni</div>
        </div>
        <div class="countdown-item">
          <div id="hours" class="countdown-number">0</div>
          <div>Ore</div>
        </div>
        <div class="countdown-item">
          <div id="minutes" class="countdown-number">0</div>
          <div>Minuti</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Programma della Giornata</h3>
